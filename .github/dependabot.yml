version: 2
updates:
    - package-ecosystem: pip
      directories:
          - /
          - /.github
      schedule:
          interval: weekly
      open-pull-requests-limit: 0
      groups:
          python-security:
              applies-to: security-updates
              patterns:
                  - '*'

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: '09:00'
          timezone: Asia/Tokyo
      open-pull-requests-limit: 3
      groups:
          github-actions:
              patterns:
                  - '*'
