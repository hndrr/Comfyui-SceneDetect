name: Publish to Comfy registry
on:
    workflow_dispatch:
        inputs:
            mode:
                description: Publish a prepared release, or sync existing release notes
                type: choice
                options:
                    - publish
                    - sync-notes
                default: publish
            release_sha:
                description: Optional merged release commit SHA; defaults to the selected master revision
                type: string
                required: false
            release_notes:
                description: Optional release summary override for manual publishing
                type: string
                required: false
    push:
        branches:
            - master
        paths:
            - pyproject.toml

permissions:
    contents: read

concurrency:
    group: comfy-registry-publish
    cancel-in-progress: false
    queue: max

jobs:
    prepare-release:
        name: Prepare Registry release
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.mode == 'publish')
        runs-on: ubuntu-latest
        outputs:
            publish: ${{ steps.notes.outputs.publish }}
            release_sha: ${{ steps.revision.outputs.sha }}
            release_version: ${{ steps.notes.outputs.version }}
            release_notes: ${{ steps.notes.outputs.body }}
        steps:
            - name: Check out release commit
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.release_sha || github.sha }}
                  fetch-depth: 0
                  persist-credentials: false
            - name: Verify and record release commit
              id: revision
              shell: bash
              env:
                  RELEASE_SHA_INPUT: ${{ inputs.release_sha }}
              run: |
                  set -euo pipefail
                  if [[ -n "$RELEASE_SHA_INPUT" && ! "$RELEASE_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]]; then
                      echo "::error::release_sha must be a full commit SHA."
                      exit 1
                  fi
                  git merge-base --is-ancestor HEAD origin/master
                  echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - name: Prepare shared release notes
              id: notes
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  BEFORE_SHA: ${{ github.event.before }}
                  RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
              run: python .github/scripts/release_notes.py prepare

    publish-node:
        name: Publish Custom Node to registry
        needs: prepare-release
        if: needs.prepare-release.outputs.publish == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Check out prepared release
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.prepare-release.outputs.release_sha }}
                  persist-credentials: false
            - name: Pin comfy-cli version
              shell: bash
              run: echo 'comfy-cli==1.22.0' > "$RUNNER_TEMP/comfy-cli-constraints.txt"
            - name: Publish Custom Node
              uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9
              env:
                  PIP_CONSTRAINT: ${{ runner.temp }}/comfy-cli-constraints.txt
                  COMFY_NODE_CHANGELOG: ${{ needs.prepare-release.outputs.release_notes }}
              with:
                  personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
                  skip_checkout: 'true'

    create-release:
        name: Create GitHub Release and sync notes
        needs: [prepare-release, publish-node]
        if: needs.prepare-release.outputs.publish == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Check out published commit
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.prepare-release.outputs.release_sha }}
                  persist-credentials: false
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - name: Create release with shared notes
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
                  RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
                  RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
                  RELEASE_NOTES: ${{ needs.prepare-release.outputs.release_notes }}
              run: python .github/scripts/release_notes.py create

    sync-release-notes:
        name: Sync notes for existing Registry versions
        if: github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' && inputs.mode == 'sync-notes'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Check out release history
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0
                  persist-credentials: false
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - name: Create missing releases and sync existing notes
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
              run: python .github/scripts/release_notes.py backfill
