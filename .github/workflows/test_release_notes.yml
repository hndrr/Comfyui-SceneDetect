name: Test release notes
on:
    pull_request:
        paths:
            - '.github/scripts/release_notes.py'
            - '.github/tests/**'
            - '.github/release-history.json'
            - '.github/workflows/publish_action.yml'
            - '.github/workflows/test_release_notes.yml'

permissions:
    contents: read

jobs:
    test-release-notes:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - run: python -m unittest discover -s .github/tests -v
