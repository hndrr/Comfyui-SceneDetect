name: Tests
on:
    pull_request:
    push:
        branches:
            - master
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: tests-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    python:
        name: Python tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            PYTHONPATH: ${{ github.workspace }}/.ci/ComfyUI
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Check out ComfyUI
              uses: actions/checkout@v7
              with:
                  repository: Comfy-Org/ComfyUI
                  ref: 98cc0bf84b7cb1383654c5b402e7612d875d6d22 # v0.41.0
                  path: .ci/ComfyUI
                  persist-credentials: false
            - uses: actions/setup-python@v7
              with:
                  python-version: '3.12'
                  cache: pip
                  cache-dependency-path: |
                      requirements.txt
                      .github/requirements-test.txt
            - name: Install test dependencies
              run: |
                  python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
                  python -m pip install -r .github/requirements-test.txt
            - name: Verify integration test dependencies
              run: |
                  python - <<'PY'
                  from comfy_api.latest import InputImpl
                  from scenedetect.backends import AVAILABLE_BACKENDS

                  assert InputImpl.VideoFromFile is not None
                  assert 'pyav' in AVAILABLE_BACKENDS, 'PyAV tests must not be skipped in CI'
                  PY
            - name: Run Python tests
              run: python -m unittest discover -s tests -v

    javascript:
        name: JavaScript tests
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version: '22'
            - name: Run JavaScript tests
              run: node --test tests/*.mjs
